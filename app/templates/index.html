<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Monitor</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; background: #0f0f0f; color: #eee; }
    h2   { margin-bottom: 24px; }
    .btn { padding: 12px 28px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 8px; }
    .start  { background: #1D9E75; color: #fff; }
    .stop   { background: #c0392b; color: #fff; }
    .record { background: #7F77DD; color: #fff; }
    #status { margin-top: 20px; font-size: 13px; color: #aaa; }
    canvas  { display: block; width: 100%; height: 80px; background: #1a1a1a; border-radius: 8px; margin-top: 20px; }
  </style>
</head>
<body>
  <h2>Live Audio Monitor</h2>
  <button class="btn start"  onclick="sendCommand('start')">▶ Start</button>
  <button class="btn stop"   onclick="sendCommand('stop')">■ Stop</button>
  <button class="btn record" onclick="toggleRecord()" id="recBtn">⏺ Record</button>
  <div id="status">Connecting…</div>
  <canvas id="viz"></canvas>

  <script>
    const status  = document.getElementById('status');
    const canvas  = document.getElementById('viz');
    const ctx     = canvas.getContext('2d');
    const SAMPLE_RATE = 16000;

    let audioCtx, isRecording = false, recordedChunks = [];
    const ws = new WebSocket(`ws://${location.host}/ws/browser/`);

    ws.onopen  = () => status.textContent = 'Connected — waiting for audio…';
    ws.onclose = () => status.textContent = 'Disconnected';

    ws.onmessage = async (e) => {
      const msg = JSON.parse(e.data);
      if (!msg.audio) return;

      // Convert hex → Int16Array PCM
      const hex   = msg.audio;
      const bytes = new Uint8Array(hex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      const pcm   = new Int16Array(bytes.buffer);

      // Play via Web Audio API
      if (!audioCtx) audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });
      const float32 = new Float32Array(pcm.length);
      for (let i = 0; i < pcm.length; i++) float32[i] = pcm[i] / 32768;

      const buffer = audioCtx.createBuffer(1, float32.length, SAMPLE_RATE);
      buffer.copyToChannel(float32, 0);
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.connect(audioCtx.destination);
      source.start();

      // Visualize
      drawWave(float32);

      // Save for recording
      if (isRecording) recordedChunks.push(...pcm);
    };

    function drawWave(samples) {
      canvas.width = canvas.offsetWidth;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#1D9E75';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      const step = Math.ceil(samples.length / canvas.width);
      for (let x = 0; x < canvas.width; x++) {
        const s = samples[x * step] || 0;
        const y = (canvas.height / 2) + s * (canvas.height / 2);
        x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function sendCommand(cmd) {
      fetch('/control/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
      }).then(() => status.textContent = `Command sent: ${cmd}`);
    }

    function toggleRecord() {
      const btn = document.getElementById('recBtn');
      if (!isRecording) {
        isRecording = true;
        recordedChunks = [];
        btn.textContent = '⏹ Stop rec';
        btn.style.background = '#e74c3c';
      } else {
        isRecording = false;
        btn.textContent = '⏺ Record';
        btn.style.background = '#7F77DD';
        downloadWav(new Int16Array(recordedChunks));
      }
    }

    function downloadWav(samples) {
      const header = new ArrayBuffer(44);
      const view   = new DataView(header);
      const write  = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      write(0, 'RIFF'); view.setUint32(4, 36 + samples.byteLength, true);
      write(8, 'WAVE'); write(12, 'fmt '); view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, 16000, true); view.setUint32(28, 32000, true);
      view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      write(36, 'data'); view.setUint32(40, samples.byteLength, true);
      const blob = new Blob([header, samples.buffer], { type: 'audio/wav' });
      const a    = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: 'recording.wav' });
      a.click();
    }
  </script>
</body>
</html>
