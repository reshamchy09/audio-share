<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Monitor (Firebase Control)</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 480px;
      margin: 60px auto;
      background: #0f0f0f;
      color: #eee;
    }

    h2 { margin-bottom: 20px; }

    button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .start { background: #1D9E75; color: white; }
    .stop { background: #c0392b; color: white; }

    #status, #streamState {
      margin-top: 10px;
      font-size: 13px;
      color: #aaa;
    }

    canvas {
      width: 100%;
      height: 80px;
      background: #1a1a1a;
      border-radius: 8px;
      margin-top: 20px;
    }

    .box {
      padding: 10px;
      background: #1b1b1b;
      border-radius: 8px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

<h2>Live Audio Monitor</h2>

<!-- 🔥 FIREBASE CONTROL BUTTONS -->
<div>
  <button class="start" onclick="setCommand('start')">▶ START</button>
  <button class="stop" onclick="setCommand('stop')">■ STOP</button>
</div>

<div class="box">
  🔥 Firebase Command: <span id="firebaseState">Waiting...</span>
</div>

<div id="streamState">🔴 Not streaming</div>
<div id="status">Connecting...</div>

<canvas id="viz"></canvas>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
/* ─────────────────────────────
   FIREBASE CONFIG
───────────────────────────── */
const firebaseConfig = {
  apiKey: "AIzaSyDESRIO-UrfdLtizx-NnyGYbc3siYJn69I",
  authDomain: "videoxyz12-99048.firebaseapp.com",
  databaseURL: "https://videoxyz12-99048-default-rtdb.firebaseio.com",
  projectId: "videoxyz12-99048",
  storageBucket: "videoxyz12-99048.appspot.com",
  messagingSenderId: "160214659694",
  appId: "1:160214659694:web:65cddc8c03acbf9296ec7f"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

/* ─────────────────────────────
   SET START / STOP COMMAND
───────────────────────────── */
function setCommand(cmd) {
  db.ref("control/audio_stream/command").set(cmd);
}

/* ─────────────────────────────
   UI ELEMENTS
───────────────────────────── */
const statusEl = document.getElementById("status");
const streamEl = document.getElementById("streamState");
const firebaseState = document.getElementById("firebaseState");
const canvas = document.getElementById("viz");
const ctx = canvas.getContext("2d");

/* ─────────────────────────────
   WEB SOCKET (AUDIO ONLY)
───────────────────────────── */
const ws = new WebSocket("wss://audio-share-bxfc.onrender.com/ws/browser/");

let audioCtx;
const SAMPLE_RATE = 16000;

ws.onopen = () => statusEl.textContent = "WebSocket connected";
ws.onclose = () => statusEl.textContent = "WebSocket closed";
ws.onerror = () => statusEl.textContent = "WebSocket error";

ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);

  if (msg.type === "ping") {
    ws.send(JSON.stringify({ type: "pong" }));
    return;
  }

  if (!msg.audio) return;

  const bytes = new Uint8Array(
    msg.audio.match(/.{1,2}/g).map(b => parseInt(b, 16))
  );

  const pcm = new Int16Array(bytes.buffer);

  if (!audioCtx)
    audioCtx = new AudioContext({ sampleRate: SAMPLE_RATE });

  const float32 = new Float32Array(pcm.length);

  for (let i = 0; i < pcm.length; i++)
    float32[i] = pcm[i] / 32768;

  const buffer = audioCtx.createBuffer(1, float32.length, SAMPLE_RATE);
  buffer.copyToChannel(float32, 0);

  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  source.start();

  drawWave(float32);
};

/* ─────────────────────────────
   FIREBASE LISTENER (REALTIME STATUS)
───────────────────────────── */
db.ref("control/audio_stream/command")
  .on("value", (snapshot) => {

    const cmd = snapshot.val();

    firebaseState.textContent = cmd;

    if (cmd === "start") {
      streamEl.textContent = "🟢 Streaming active";
      streamEl.style.color = "#1D9E75";
    }

    if (cmd === "stop") {
      streamEl.textContent = "🔴 Streaming stopped";
      streamEl.style.color = "#c0392b";
    }
  });

/* ─────────────────────────────
   WAVEFORM
───────────────────────────── */
function drawWave(data) {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = "#1D9E75";
  ctx.beginPath();

  const step = Math.ceil(data.length / canvas.width);
  const mid = canvas.height / 2;

  for (let x = 0; x < canvas.width; x++) {
    const sample = data[x * step] || 0;
    const y = mid + sample * mid;

    x === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }

  ctx.stroke();
}
</script>

</body>
</html>
